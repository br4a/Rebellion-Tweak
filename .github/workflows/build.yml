name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq build-essential
          git clone -q --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -ksL "https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS14.5.sdk.tar.xz" -o ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz
          tar -xf ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz -C ~/theos/sdks/
          rm ~/theos/sdks/iPhoneOS14.5.sdk.tar.xz
          echo "THEOS=~/theos" >> $GITHUB_ENV

      - name: compile
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - uses: actions/upload-artifact@v4
        with:
          name: RebellionAlert-DEB
          path: packages/*.deb
